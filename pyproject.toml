    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
