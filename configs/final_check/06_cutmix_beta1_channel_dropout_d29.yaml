experiment:
  name: cutmix_beta1_channel_dropout_d29
  seed: 0
data:
  train_manifest: data/processed/splits/d2_9exp_train_treatment.csv
  val_manifest: data/processed/splits/d2_9exp_val_treatment.csv
  train_control_manifest: data/processed/splits/d2_9exp_train_control.csv
  val_control_manifest: data/processed/splits/d2_9exp_val_control.csv
  image_size: 384
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  shuffle_val: false
model:
  name: efficientnet_b2
  pretrained: true
  dropout: 0.22
optimizer:
  name: adamw
  base_lr: 7.562760031052943e-05
  weight_decay: 0.0003
  lr_ratio:
  - 1.0
  - 4.684416978885584
  - 8.6406378065851
  - 30.64707646122206
  fusion_lr_ratio: 3.0
scheduler:
  name: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
loss:
  name: cross_entropy
training:
  epochs: 20
normalization:
  enabled: true
  method: zscore
  eps: 1.0e-06
  reference:
    population: NP
    split_policy: train_only
  statistics:
    source: reference
    grouping: plate
    spatial: global
    channel: shared
    std_type: population
  application:
    position: before_resize
  cache:
    dir: outputs/normalization_stats
    load: true
    save: true
    missing: compute
  missing_group: error
transform:
  switch: true
  train:
  - name: resize
    size: 384
  - name: horizontal_flip
    p: 0.5
  - name: vertical_flip
    p: 0.5
  - name: random_90_rotation
    p: 1.0
  - name: channel_dropout
    p: 0.2
    max_channels: 1
  val:
  - name: resize
    size: 384
  batch:
  - name: cutmix
    alpha: 1.0
    p: 1.0
metric:
  enabled: false
checkpoint:
  enabled: true
  dir: outputs/checkpoints
  monitor: val_acc
logging:
  level: INFO
  log_dir: outputs/logs
wandb:
  enabled: true
  project: rxrx1
  mode: online
  dir: outputs
git_ref: null
git_commit: null
