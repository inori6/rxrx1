experiment:
  name: resnet18_norm
  seed: 0

data:
  train_manifest: data/processed/splits/d1_train_treatment.csv
  val_manifest: data/processed/splits/d1_val_treatment.csv

  batch_size: 32
  num_workers: 4

  shuffle_train: true
  shuffle_val: false
  image_size: 384

transform:
  compute_norm_stats: true

  norm_mean: null
  norm_std: null

  train:
    - name: resize
      size: 384

    - name: normalize

  val:
    - name: resize
      size: 384

    - name: normalize

model:
  name: resnet18
  pretrained: true

loss:
  name: cross_entropy

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

training:
  epochs: 5

logging:
  level: INFO
  log_dir: outputs/logs

checkpoint:
  enabled: true
  dir: outputs/checkpoints
  monitor: val_acc

wandb:
  enabled: true
  project: rxrx1
  mode: online
  dir: outputs
