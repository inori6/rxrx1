experiment:
  name: embedding_celltype_concat_neck_d2
  seed: 0
data:
  train_manifest: data/processed/splits/d2_train_treatment.csv
  train_control_manifest: data/processed/splits/d2_train_control.csv
  val_manifest: data/processed/splits/d2_val_treatment.csv
  val_control_manifest: data/processed/splits/d2_val_control.csv
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  shuffle_val: false
  image_size: 384
model:
  name: efficientnet_b2_concat_neck
  pretrained: true
  embedding_size: 1024
  bn_momentum: 0.05
  metadata:
    enabled: true
    method: concat
    cell_type: true
    well_position: false
    num_cell_types: 4
    well_dim: 2
loss:
  name: cross_entropy
optimizer:
  name: adamw
  base_lr: 7.562760031052943e-05
  lr_ratio:
  - 1.0
  - 4.684416978885584
  - 8.6406378065851
  - 30.64707646122206
  fusion_lr_ratio: 3.0
  weight_decay: 0.0003
training:
  epochs: 20
transform:
  switch: true
  train:
  - name: resize
    size: 384
  - name: horizontal_flip
    p: 0.5
  - name: vertical_flip
    p: 0.5
  - name: random_90_rotation
    p: 1.0
  val:
  - name: resize
    size: 384
  batch: []
normalization:
  enabled: true
  method: zscore
  eps: 1.0e-06
  missing_group: error
  reference:
    population: NP
    split_policy: train_only
  statistics:
    source: reference
    grouping: plate
    spatial: global
    channel: shared
    std_type: population
  application:
    position: before_resize
  cache:
    dir: outputs/normalization_stats
    load: true
    save: true
    missing: compute
metric:
  enabled: false
scheduler:
  name: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
logging:
  level: INFO
  log_dir: outputs/logs
checkpoint:
  enabled: true
  dir: outputs/checkpoints
  monitor: val_acc
wandb:
  enabled: true
  project: rxrx1
  mode: online
  dir: outputs
git_ref: null
git_commit: null
