experiment:
  name: model_baseline_hpo_verify_seed1
  seed: 1

data:
  train_manifest: data/processed/splits/d1_train_treatment.csv
  train_control_manifest: data/processed/splits/d1_train_control.csv
  val_manifest: data/processed/splits/d1_val_treatment.csv
  val_control_manifest: data/processed/splits/d1_val_control.csv
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  shuffle_val: false
  image_size: 384

model:
  name: efficientnet_b2
  pretrained: true
  dropout: 0.22

loss:
  name: cross_entropy

optimizer:
  name: adamw
  base_lr: 8.5e-5
  lr_ratio:
    - 1.0
    - 4.7
    - 8.0
    - 25.0
  weight_decay: 3e-4

training:
  epochs: 20

transform:
  switch: true
  train:
    - name: resize
      size: 384
    - name: horizontal_flip
      p: 0.5
    - name: vertical_flip
      p: 0.5
    - name: random_90_rotation
      p: 1.0
  val:
    - name: resize
      size: 384

normalization:
  enabled: true
  method: zscore
  eps: 1.0e-6
  missing_group: error
  reference:
    population: NP
    split_policy: train_only
  statistics:
    source: reference
    grouping: plate
    spatial: global
    channel: shared
    std_type: population
  application:
    position: before_resize
  cache:
    dir: outputs/normalization_stats
    load: true
    save: true
    missing: compute

logging:
  level: INFO
  log_dir: outputs/logs

checkpoint:
  enabled: true
  dir: outputs/checkpoints
  monitor: val_acc

wandb:
  enabled: true
  project: rxrx1
  mode: online
  dir: outputs

git_ref: null
git_commit: null

scheduler:
  name: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
