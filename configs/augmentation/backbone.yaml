experiment:
  name: backbone
  seed: 0

data:
  train_manifest: data/processed/splits/d1_train_treatment.csv
  train_control_manifest: data/processed/splits/d1_train_control.csv
  val_manifest: data/processed/splits/d1_val_treatment.csv
  val_control_manifest: data/processed/splits/d1_val_control.csv
  batch_size: 32
  num_workers: 4
  shuffle_train: true
  shuffle_val: false
  image_size: 384

model:
  name: efficientnet_b2
  pretrained: true

loss:
  name: cross_entropy

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

training:
  epochs: 20

transform:
  switch: true
  train:
    - name: random_resized_crop
      size: 384
      scale: [0.5, 1.0]
      ratio: [1.0, 1.0]
      interpolation: nearest
    - name: horizontal_flip
      p: 0.5
    - name: vertical_flip
      p: 0.5
    - name: random_90_rotation
      p: 1.0
  val:
    - name: resize
      size: 384

normalization:
  enabled: true
  method: zscore
  eps: 0.000001
  missing_group: error
  reference:
    population: NP
    split_policy: train_only
  statistics:
    source: reference
    grouping: plate
    spatial: global
    channel: shared
    std_type: population
  application:
    position: before_resize
  cache:
    dir: outputs/normalization_stats
    load: true
    save: true
    missing: compute

logging:
  level: INFO
  log_dir: outputs/logs

checkpoint:
  enabled: true
  dir: outputs/checkpoints
  monitor: val_acc

wandb:
  enabled: true
  project: rxrx1
  mode: online
  dir: outputs

git_ref: null
git_commit: null
